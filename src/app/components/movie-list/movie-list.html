<div class="movie-list">
  @if (movies().length === 0) {
  <div class="movie-list__empty">
    <span class="movie-list__empty-icon">🎬</span>
    <h3 class="movie-list__empty-title">Нет фильмов</h3>
    <p class="movie-list__empty-text">Добавьте свой первый фильм</p>
  </div>
  } @else {
  <div class="movie-list__grid">
    @for (movie of movies(); track movie.id) {
    <app-movie-card [movie]="movie" (favoriteToggle)="onToggleFavorite($event)" (edit)="onEditMovie($event)"
      (delete)="onDeleteMovie($event)" />
    }
  </div>
  }
</div>
